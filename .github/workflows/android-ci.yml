name: Android debug build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          TOOL="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$(command -v sdkmanager)"; fi
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Canvas JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/neural/index.html').read_text(encoding='utf-8')
          if '<script>' not in html or '</script>' not in html:
              raise SystemExit('Neural Canvas script missing')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/horizon-neural-canvas.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/horizon-neural-canvas.js
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
